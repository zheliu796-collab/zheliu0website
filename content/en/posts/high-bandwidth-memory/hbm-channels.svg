<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">HBM channel organization</title><desc id="desc">HBM3E has 16 64-bit channels and HBM4 has 32 64-bit channels; each illustrated channel is split into two 32-bit pseudo-channels.</desc><style>text{font-family:system-ui,sans-serif;fill:#252c27;font-size:20px}.title{font-size:26px;font-weight:650}.small{font-size:17px}.bold{font-weight:650}.muted{fill:#596452}.box{fill:#e2e7d9;stroke:#a4b397;stroke-width:1.5}.line{stroke:#4e6849;stroke-width:3;fill:none}</style><rect width="720" height="470" rx="16" fill="#f0f0e7"/><text x="32" y="45" class="title">More channels, wider interface</text>
<rect x="32" y="80" width="312" height="145" rx="10" class="box"/><text x="52" y="115" class="bold">HBM3E</text><text x="52" y="150">16 × 64-bit channels</text><text x="52" y="180" class="bold">1,024 data bits</text><text x="52" y="208" class="small">32 pseudo-channels</text><rect x="376" y="80" width="312" height="145" rx="10" class="box"/><text x="396" y="115" class="bold">HBM4</text><text x="396" y="150">32 × 64-bit channels</text><text x="396" y="180" class="bold">2,048 data bits</text><text x="396" y="208" class="small">64 pseudo-channels</text>
<text x="32" y="275">Zoom in: one 64-bit channel</text><rect x="32" y="298" width="656" height="75" rx="8" class="box"/><path d="M360 298V373" class="line"/><text x="68" y="342">32-bit pseudo-channel</text><text x="397" y="342">32-bit pseudo-channel</text><text x="32" y="420" class="small muted">Pseudo-channels subdivide the data width.</text><text x="32" y="446" class="small muted">They do not double the wires or determine the DRAM layer count.</text></svg>