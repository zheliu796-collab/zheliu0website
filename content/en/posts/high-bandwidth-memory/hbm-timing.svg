<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Bit intervals and sampling margin</title><desc id="desc">At 10 gigabits per second each bit lasts 100 picoseconds; at 12 gigabits per second it lasts approximately 83.3 picoseconds. A conceptual sampling window is smaller than a full bit interval.</desc><style>text{font-family:system-ui,sans-serif;fill:#252c27;font-size:20px}.title{font-size:26px;font-weight:650}.small{font-size:17px}.bold{font-weight:650}.muted{fill:#596452}.box{fill:#e2e7d9;stroke:#a4b397;stroke-width:1.5}.line{stroke:#4e6849;stroke-width:3;fill:none}</style><rect width="720" height="470" rx="16" fill="#f0f0e7"/><text x="32" y="45" class="title">Fast bits leave little time</text><text x="32" y="98">10 Gb/s</text><path d="M170 80V125M670 80V125M170 103H670" class="line"/><text x="350" y="92" class="bold">100 ps</text>
<text x="32" y="165">12 Gb/s</text><path d="M170 145V190M587 145V190M170 168H587" class="line"/><text x="325" y="157" class="bold">83.3 ps</text>
<text x="32" y="235">Conceptual sampling window within one bit</text><rect x="95" y="270" width="530" height="100" fill="#dcded2" rx="8"/><rect x="265" y="270" width="190" height="100" fill="#bfd0ae"/><path d="M95 355L155 355L210 285L510 285L565 355L625 355M95 285L155 285L210 355L510 355L565 285L625 285" class="line"/><path d="M360 258V382" stroke="#252c27" stroke-width="2" stroke-dasharray="5 5"/><text x="268" y="410" class="small">Sample near center</text><text x="32" y="452" class="small muted">Schematic only · not an eye measurement or a timing budget</text></svg>