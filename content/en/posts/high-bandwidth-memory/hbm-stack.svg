<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">A simplified HBM package</title><desc id="desc">DRAM dies stack above a base die. Vertical TSV connections run through the stack, and a wide interface in the interposer connects it to a neighboring processor.</desc><rect width="720" height="340" rx="12" fill="#e8e9df"/><g font-family="system-ui,sans-serif" fill="#252c27"><text x="34" y="38" font-size="13" letter-spacing="2">HBM: STACKED MEMORY, WIDE CONNECTIONS</text><rect x="60" y="131" width="210" height="114" rx="8" fill="#4e6849"/><text x="165" y="193" text-anchor="middle" fill="#fff" font-size="22">Processor</text><g fill="#b9c9ad" stroke="#4e6849" stroke-width="2"><rect x="420" y="78" width="210" height="30" rx="4"/><rect x="420" y="115" width="210" height="30" rx="4"/><rect x="420" y="152" width="210" height="30" rx="4"/></g><g stroke="#4e6849" stroke-width="4" stroke-dasharray="4 3"><path d="M442 90V208M470 90V208M498 90V208"/></g><text x="558" y="99" text-anchor="middle" font-size="14">DRAM</text><text x="558" y="136" text-anchor="middle" font-size="14">DRAM</text><text x="558" y="173" text-anchor="middle" font-size="14">DRAM</text><rect x="420" y="199" width="210" height="46" rx="5" fill="#737970"/><text x="525" y="228" fill="#fff" text-anchor="middle" font-size="17">Base die</text><rect x="40" y="251" width="620" height="44" rx="5" fill="#d0d5c6"/><g stroke="#4e6849" stroke-width="2"><path d="M165 245V262H525V245M175 245V270H535V245M185 245V278H545V245"/></g><text x="350" y="320" text-anchor="middle" font-size="14">Interposer · many parallel connections</text><text x="350" y="115" text-anchor="middle" font-size="13">TSVs →</text></g></svg>