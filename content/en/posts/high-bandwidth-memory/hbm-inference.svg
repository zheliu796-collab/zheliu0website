<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-labelledby="title desc"><title id="title">Memory in language-model inference</title><desc id="desc">HBM holds model weights and cached attention state. Prefill processes a prompt in parallel, while decode generates tokens in repeated steps.</desc><style>text{font-family:system-ui,sans-serif;fill:#252c27;font-size:20px}.title{font-size:26px;font-weight:650}.small{font-size:17px}.bold{font-weight:650}.muted{fill:#596452}.box{fill:#e2e7d9;stroke:#a4b397;stroke-width:1.5}.line{stroke:#4e6849;stroke-width:3;fill:none}</style><rect width="720" height="510" rx="16" fill="#f0f0e7"/><text x="32" y="45" class="title">Same memory, different demands</text><rect x="32" y="80" width="656" height="105" rx="10" class="box"/><text x="55" y="115" class="bold">HBM</text><text x="55" y="150">Model weights</text><text x="300" y="150">KV cache + working data</text>
<path d="M190 185V225M530 185V225" class="line"/><path d="M182 215L190 225L198 215M522 215L530 225L538 215" class="line"/>
<rect x="32" y="235" width="312" height="200" rx="10" class="box"/><rect x="376" y="235" width="312" height="200" rx="10" class="box"/>
<text x="55" y="273" class="bold">Prefill</text><text x="55" y="305">Process prompt tokens</text><text x="55" y="333">together</text><text x="55" y="385" class="small">Parallel work can enable</text><text x="55" y="410" class="small">greater data reuse.</text>
<text x="399" y="273" class="bold">Decode</text><text x="399" y="305">Token → token → token</text><text x="399" y="333">Repeated generation steps</text><text x="399" y="385" class="small">Small batches can require</text><text x="399" y="410" class="small">heavy weight streaming.</text>
<text x="32" y="480" class="small muted">Longer sequences and larger batches require more KV storage.</text></svg>