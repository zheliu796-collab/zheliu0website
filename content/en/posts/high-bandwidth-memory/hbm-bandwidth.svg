<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" role="img" aria-labelledby="title desc"><title id="title">Width and speed both increase bandwidth</title><desc id="desc">Calculated peak bandwidth for four illustrative interface configurations.</desc><style>text{font-family:system-ui,sans-serif;fill:#252c27;font-size:20px}.title{font-size:26px;font-weight:650}.small{font-size:17px}.bold{font-weight:650}.muted{fill:#596452}.box{fill:#e2e7d9;stroke:#a4b397;stroke-width:1.5}.line{stroke:#4e6849;stroke-width:3;fill:none}</style><rect width="720" height="470" rx="16" fill="#f0f0e7"/><text x="32" y="45" class="title">Two ways to move more data</text><text x="32" y="77" class="small">Peak bandwidth = data width × per-pin rate ÷ 8</text>
<text x="32" y="115">1,024 bits × 6.4 Gb/s</text><rect x="32" y="125" width="140" height="29" rx="4" fill="#6e8660"/><text x="182" y="147" class="small">0.8192 TB/s</text><text x="32" y="200">1,024 bits × 9.6 Gb/s</text><rect x="32" y="210" width="210" height="29" rx="4" fill="#6e8660"/><text x="252" y="232" class="small">1.2288 TB/s</text><text x="32" y="285">2,048 bits × 8.0 Gb/s</text><rect x="32" y="295" width="350" height="29" rx="4" fill="#6e8660"/><text x="392" y="317" class="small">2.0480 TB/s</text><text x="32" y="370">2,048 bits × 12.0 Gb/s</text><rect x="32" y="380" width="525" height="29" rx="4" fill="#6e8660"/><text x="567" y="402" class="small">3.0720 TB/s</text><text x="32" y="450" class="small muted">Illustrative arithmetic · decimal units · not measured throughput</text></svg>